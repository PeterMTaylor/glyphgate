[project]
name = "glyphgate"
version = "0.1.0"
description = "Glyphgate: modular narrative‑system toolkit for Theron’s Ways."
authors = [
    { name = "Peter M. Taylor" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

# Core runtime dependencies
dependencies = [
    "tomli",        # for parsing glyphgate.toml
    "duckdb",       # future ecology + cadence data flows
    "click",        # CLI entrypoint
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# CLI entrypoint
[project.scripts]
glyphgate = "cli.glyphgate_cli:main"

[tool.setuptools]
packages = [
    "cli",
    "core",
    "loader",
    "ecology",
    "cadence_pass"
]

[tool.setuptools.package-data]
glyphgate = ["glyphgate.toml"]

